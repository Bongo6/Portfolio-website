      <!--
        Work detail panel. Content per card comes from two places:
        1. Title/tag: pulled straight from that card's .portfolio-title / .portfolio-tag
        2. Description: looked up from content.json by card number (edit that file only)
        Gallery images/videos are reused from the card's own media/NN folder.
      -->
      <aside class="work-detail" id="work-detail" aria-hidden="true">
        <button class="work-detail-close" id="work-detail-close" aria-label="Close">&times;</button>
        <div class="work-detail-inner">
          <h2 class="work-detail-title" id="work-detail-title"></h2>
          <div class="work-detail-tag" id="work-detail-tag"></div>
