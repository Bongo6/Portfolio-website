<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A gallery-first portfolio with category navigation and a crisp visual grid." />
    <meta name="keywords" content="portfolio, gallery, photography, editorial, 3D, minimalist design" />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Aaron van den Bossche | Portfolio" />
    <meta property="og:description" content="Gallery-first portfolio layout with category navigation and clean image grid." />
    <title>Aaron van den Bossche | Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="portfolio-header">
        <p class="portfolio-overline">Portfolio</p>
        <h1>Selected works</h1>
      </header>

      <section class="portfolio-list" aria-label="Portfolio items">
        <article class="portfolio-item">
          <div class="item-thumb">
            <img src="https://picsum.photos/seed/art-01/1500/900" alt="Editorial photo for project one" />
          </div>
          <div class="item-content">
            <h2>Collide</h2>
            <div class="item-tags">
              <span>Illustrator</span>
              <span>Photoshop</span>
              <span>Editorial</span>
            </div>
          </div>
        </article>

        <article class="portfolio-item">
          <div class="item-thumb">
            <img src="https://picsum.photos/seed/art-02/1500/900" alt="Photography project for open item" />
          </div>
          <div class="item-content">
            <h2>Rosewood</h2>
            <div class="item-tags">
              <span>Photography</span>
              <span>Lightroom</span>
              <span>Branding</span>
            </div>
          </div>
        </article>

        <article class="portfolio-item">
          <div class="item-thumb">
            <img src="https://picsum.photos/seed/art-03/1500/900" alt="Product design project photo" />
          </div>
          <div class="item-content">
            <h2>Punch</h2>
            <div class="item-tags">
              <span>3D</span>
              <span>After Effects</span>
              <span>Motion</span>
            </div>
          </div>
        </article>

        <article class="portfolio-item">
          <div class="item-thumb">
            <img src="https://picsum.photos/seed/art-04/1500/900" alt="Editorial layout for studio work" />
          </div>
          <div class="item-content">
            <h2>Thyme</h2>
            <div class="item-tags">
              <span>InDesign</span>
              <span>Styling</span>
              <span>Print</span>
            </div>
          </div>
        </article>

        <article class="portfolio-item">
          <div class="item-thumb">
            <img src="https://picsum.photos/seed/art-05/1500/900" alt="Packaging design project photo" />
          </div>
          <div class="item-content">
            <h2>Quarter</h2>
            <div class="item-tags">
              <span>Brand</span>
              <span>Packaging</span>
              <span>Illustration</span>
            </div>
          </div>
        </article>
      </section>
    </div>
  </body>
</html>
